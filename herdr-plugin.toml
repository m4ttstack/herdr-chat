id = "m4ttstack.chat"
name = "Chat"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "rt chat where the agents live: broadcast, presence, jump-to-pane"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open-viewer"
title = "Open chat viewer"
contexts = ["workspace"]
command = ["target/release/herdr-chat", "open-viewer"]

[[actions]]
id = "sign-in"
title = "Sign in to chat"
contexts = ["pane"]
command = ["target/release/herdr-chat", "sign-in"]

[[actions]]
id = "sign-out"
title = "Sign out of chat"
contexts = ["pane"]
command = ["target/release/herdr-chat", "sign-out"]

[[events]]
on = "pane.agent_detected"
command = ["target/release/herdr-chat", "on-agent-detected"]

[[panes]]
id = "signin-ask"
title = "Sign in to chat?"
placement = "popup"
width = "66"
height = "11"
command = ["target/release/herdr-chat", "signin-ask"]
